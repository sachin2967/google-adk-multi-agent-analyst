services:
  adk-api:
    build: .
    container_name: adk-analyst-api
    ports:
      - "127.0.0.1:${ANALYST_API_PORT:-8040}:8000"
    environment:
      APP_ENV: ${APP_ENV:-local}
      ANALYST_API_KEY: ${ANALYST_API_KEY:-}
      ANALYST_MODEL: ${ANALYST_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-FALSE}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  adk-dashboard:
    build: .
    container_name: adk-analyst-dashboard
    ports:
      - "127.0.0.1:${ANALYST_DASHBOARD_PORT:-8540}:8501"
    environment:
      ANALYST_API_URL: http://adk-api:8000
      ANALYST_API_KEY: ${ANALYST_API_KEY:-}
    command: ["streamlit", "run", "streamlit_app/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      - adk-api
    restart: unless-stopped
