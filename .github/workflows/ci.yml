name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src api tests data scripts streamlit_app
      - name: Format check
        run: ruff format --check src api tests data scripts streamlit_app
      - name: Run tests
        run: python -m pytest -q
      - name: Check MCP tool aggregates
        run: python scripts/run_benchmark.py
      - name: Validate frozen analyst cases without provider calls
        run: python scripts/evaluate_live.py --split all --max-cases 12
